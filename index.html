<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1a18">
<title>Tape deck</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Share+Tech+Mono&family=Archivo+Narrow:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#1b1a18;color:#e9e1cf;font-family:"Archivo Narrow",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 14px);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),linear-gradient(#2b2926,#211f1d)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 4px 14px}
.stamp{font-weight:700;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#8f887b;line-height:1.5}
.stamp b{color:#d24a32;font-weight:700}
.counter{display:flex;gap:3px;background:#0d0d0c;border:1px solid #000;border-radius:4px;padding:5px 7px;box-shadow:inset 0 2px 6px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.06)}
.counter span{font-family:"Share Tech Mono",monospace;font-size:22px;line-height:1;color:#f2b33d;text-shadow:0 0 6px rgba(242,179,61,.45);min-width:.62em;text-align:center}
.well{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#141312;border-radius:14px;padding:18px 12px;
  box-shadow:inset 0 6px 18px rgba(0,0,0,.85),inset 0 -1px 0 rgba(255,255,255,.04),0 1px 0 rgba(255,255,255,.05)}
#tape{width:100%;height:100%;max-height:100%;touch-action:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6));transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
#tape.pop{transform:translateY(-14px) scale(.98)}
#tape.out{transform:translateY(110%);transition:transform .28s cubic-bezier(.5,0,.9,.4)}
.hand{font-family:"Permanent Marker",cursive;fill:#24317a}
.hit{fill:transparent;cursor:grab}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:16px;padding:8px;background:#0f0e0d;border-radius:8px;box-shadow:inset 0 3px 8px rgba(0,0,0,.9)}
.key{appearance:none;border:0;height:76px;border-radius:4px 4px 7px 7px;background:linear-gradient(#f4ecda,#e2d6bb);color:#2a2622;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 7px 0 #a99c80,0 9px 6px rgba(0,0,0,.5),inset 0 1px 0 #fff;transition:transform .06s,box-shadow .06s;cursor:pointer}
.key svg{width:22px;height:22px}
.key small{font-weight:700;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#6e6455}
.key:active,.key.down{transform:translateY(6px);box-shadow:0 1px 0 #a99c80,0 2px 3px rgba(0,0,0,.5),inset 0 2px 4px rgba(0,0,0,.12);background:linear-gradient(#e6dcc6,#d9cdb1)}
.key.play{background:linear-gradient(#e85b40,#cc4329);color:#fff4e8;box-shadow:0 7px 0 #8c2a17,0 9px 6px rgba(0,0,0,.5),inset 0 1px 0 #ff9b84}
.key.play small{color:#ffd9cc}
.key.play.down,.key.play:active{box-shadow:0 1px 0 #8c2a17,0 2px 3px rgba(0,0,0,.5),inset 0 2px 5px rgba(0,0,0,.2);background:linear-gradient(#d24a32,#bb3b23)}
.hint{text-align:center;margin-top:14px;font-family:"Permanent Marker",cursive;font-size:14px;color:#8f887b;transition:opacity .6s}
.hint.gone{opacity:0}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translate(-50%,-20px);opacity:0;background:#efe3c2;color:#24317a;font-family:"Permanent Marker",cursive;font-size:15px;padding:8px 14px;border-radius:3px;box-shadow:0 6px 16px rgba(0,0,0,.5);transition:.3s;pointer-events:none;white-space:nowrap;rotate:-1.5deg}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* j-card tracklist */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(480px,100%);max-height:78%;transform:translate(-50%,105%);transition:transform .32s cubic-bezier(.2,.9,.3,1);
  background:#f1e7cc;color:#24317a;border-radius:10px 10px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(0,0,0,.6);padding-bottom:env(safe-area-inset-bottom)}
.sheet.open{transform:translate(-50%,0)}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;border-bottom:3px solid #d24a32}
.pl{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.stamp2{font-weight:700;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#8f7f60}
#plInput{appearance:none;border:0;border-bottom:2px dashed transparent;background:none;font-family:"Permanent Marker",cursive;font-size:24px;color:#24317a;padding:2px 0;width:100%;outline:none}
#plInput:focus{border-bottom-color:#b9c6da}
.close{appearance:none;border:0;background:none;width:44px;height:44px;color:#24317a;font-size:26px;cursor:pointer}
.list{overflow-y:auto;flex:1;list-style:none;background:repeating-linear-gradient(#f1e7cc 0 43px,#b9c6da 43px 44px)}
.list li{display:flex;gap:12px;align-items:baseline;height:44px;padding:0 18px;font-family:"Permanent Marker",cursive;font-size:17px;cursor:pointer;white-space:nowrap;overflow:hidden}
.list li .n{color:#d24a32;min-width:26px;font-size:15px}
.list li .t{overflow:hidden;text-overflow:ellipsis;line-height:44px}
.list li.on .t{text-decoration:underline wavy #d24a32 2px;text-underline-offset:5px}
.list .empty{color:#6e6455;cursor:default}
.sheet footer{display:flex;gap:10px;padding:12px 18px 16px;border-top:1px solid #d8cba8}
.btn{appearance:none;flex:1;height:48px;border-radius:4px;border:2px solid #24317a;background:transparent;color:#24317a;font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.btn.fill{background:#24317a;color:#f1e7cc}
.btn.warn{border-color:#d24a32;color:#d24a32}
.btn.warn.armed{background:#d24a32;color:#fff}
.note{font-size:12px;color:#6e6455;padding:0 18px 10px}

.top{grid-area:top}.track{grid-area:track}.well{grid-area:well}.keys{grid-area:keys}.hint{grid-area:hint}
.app{display:grid!important;grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-rows:auto auto minmax(0,1fr) auto auto;grid-template-areas:"top" "track" "well" "keys" "hint"}
@media (orientation:landscape){
  .app{max-width:none;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 14px)}
  .top{padding:0 4px 8px}.hint{display:none}.well{padding:6px}
  .app{grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);column-gap:22px;
    grid-template-areas:"top track" "well well"}
  .top{padding:0 0 8px;gap:16px}.track{padding:0 4px 8px}
}
.well{position:relative}
@keyframes nudge{0%,100%{filter:none}50%{filter:drop-shadow(0 0 8px rgba(242,179,61,.95)) brightness(1.06)}}
.key.nudge{animation:nudge 1.6s ease-in-out infinite}
.key.nudge small{color:#b5651d}
.tabs{display:flex;align-items:center;gap:4px;padding:8px 14px 0;border-bottom:1px solid #d8cba8}
.tab{appearance:none;border:0;background:none;font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#8f7f60;padding:10px 10px 9px;border-bottom:3px solid transparent;cursor:pointer;min-height:44px}
.tab.on{color:#24317a;border-bottom-color:#24317a}
.tab.edit.on{color:#d24a32;border-bottom-color:#d24a32}
.tabs .sp{flex:1}
.sheet footer[hidden]{display:none}
.list li .t small{font-family:"Archivo Narrow",sans-serif;font-size:13px;color:#8f7f60;margin-left:8px}
.list li .tools{margin-left:auto;display:flex;gap:2px;flex-shrink:0}
.list li .tools button{appearance:none;border:0;background:none;width:40px;height:40px;color:#24317a;font-size:18px;cursor:pointer;border-radius:4px}
.list li .tools button:active{background:#e3d7b8}
.list li .tools button.rm{color:#d24a32}
.list li .tools button.rm.armed{background:#d24a32;color:#fff;width:auto;padding:0 10px;font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.list li .sw{width:26px;height:16px;border-radius:2px;flex-shrink:0;align-self:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.list li.tape{align-items:center}
.list li.tape .cnt{font-family:"Archivo Narrow",sans-serif;font-size:13px;color:#8f7f60;flex-shrink:0}
.list li.add{color:#d24a32}.list li.add .t{text-decoration:underline;text-underline-offset:5px}
.track{display:flex;align-items:center;gap:10px;padding:0 4px 14px;font-family:"Share Tech Mono",monospace;font-size:14px;color:#c9c1b0}
.track span{min-width:40px}.track span:last-child{text-align:right}
.ruler{position:relative;flex:1;height:34px;touch-action:none;cursor:pointer}
.ruler .bar{position:absolute;left:0;right:0;top:12px;height:10px;border-radius:2px;background:#0d0d0c;box-shadow:inset 0 2px 4px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.06);overflow:hidden}
.ruler .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(90deg,#5a3d27 0 3px,#6e4a30 3px 6px)}
.ruler .ticks{position:absolute;left:0;right:0;top:3px;height:6px;background:repeating-linear-gradient(90deg,#6e675b 0 1px,transparent 1px 10%)}
.ruler .ticks.b{top:25px}
.ruler .needle{position:absolute;top:6px;width:3px;height:22px;margin-left:-1.5px;background:#d24a32;border-radius:1px;box-shadow:0 0 6px rgba(210,74,50,.6)}
@media (orientation:landscape){.track{padding:0 4px 8px}}
.keys.onTape{position:absolute;margin:0;gap:4%;padding:1.2% 1.6%;border-radius:6px;background:#141517;box-shadow:inset 0 2px 6px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.08)}
.keys.onTape .key{height:auto;box-shadow:0 5px 0 #a99c80,0 6px 4px rgba(0,0,0,.5),inset 0 1px 0 #fff}
.keys.onTape .key.play{box-shadow:0 5px 0 #8c2a17,0 6px 4px rgba(0,0,0,.5),inset 0 1px 0 #ff9b84}
.keys.onTape .key:active,.keys.onTape .key.down{transform:translateY(4px);box-shadow:0 1px 0 #a99c80,inset 0 2px 4px rgba(0,0,0,.15)}
.keys.onTape .key.play.down,.keys.onTape .key.play:active{box-shadow:0 1px 0 #8c2a17,inset 0 2px 5px rgba(0,0,0,.25)}
.keys.onTape .key small{font-size:9px;letter-spacing:.1em}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="stamp">auto stop · normal<br><b>&#9679;</b> <span id="status">no tape</span></div>
    <div class="counter" aria-label="time"><span id="c0">0</span><span>:</span><span id="c1">0</span><span id="c2">0</span></div>
  </div>

  <div class="track"><span id="tNow">0:00</span>
    <div class="ruler" id="ruler" aria-label="song position"><div class="ticks"></div><div class="bar"><div class="fill" id="tFill"></div></div><div class="ticks b"></div><div class="needle" id="tNeedle"></div></div>
    <span id="tLen">0:00</span></div>

  <div class="well">
    <svg id="tape" viewBox="0 0 400 256" aria-label="cassette — tap a reel to play, drag it round to wind">
      <defs>
        <clipPath id="win"><rect x="96" y="70" width="208" height="70" rx="35"/></clipPath>
        <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b5158"/><stop offset="1" stop-color="#33373c"/></linearGradient>
        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <radialGradient id="ringsL" gradientUnits="userSpaceOnUse" cx="146" cy="105" r="2.3" spreadMethod="repeat"><stop offset="0" stop-color="#3a2416"/><stop offset=".45" stop-color="#3f2718"/><stop offset=".6" stop-color="#321f12"/><stop offset="1" stop-color="#3a2416"/></radialGradient>
        <radialGradient id="ringsR" href="#ringsL" cx="254" cy="105"/>
        <radialGradient id="fineL" gradientUnits="userSpaceOnUse" cx="146" cy="105" r=".7" spreadMethod="repeat"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".5" stop-color="#000" stop-opacity=".22"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
        <radialGradient id="fineR" href="#fineL" cx="254" cy="105"/>
        <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1"><stop offset=".2" stop-color="#fff" stop-opacity="0"/><stop offset=".38" stop-color="#ffd9b0" stop-opacity=".16"/><stop offset=".46" stop-color="#fff" stop-opacity=".05"/><stop offset=".62" stop-color="#ffd9b0" stop-opacity=".09"/><stop offset=".8" stop-color="#fff" stop-opacity="0"/></linearGradient>
      </defs>
      <g id="rot">
      <rect x="2" y="2" width="396" height="252" rx="16" fill="url(#shell)" stroke="#1d2024" stroke-width="2"/>
      <rect x="20" y="16" width="360" height="160" rx="7" fill="#efe3c2"/>
      <line x1="64" y1="52" x2="366" y2="52" stroke="#b9c6da" stroke-width="1.5"/>
      <line x1="34" y1="160" x2="366" y2="160" stroke="#b9c6da" stroke-width="1"/>
      <rect class="bandc" x="20" y="148" width="360" height="24" fill="#d24a32"/>
      <rect class="bandc" x="20" y="168" width="360" height="8" rx="0" fill="#d24a32"/>
      <rect class="bandc" x="20" y="164" width="360" height="12" rx="7" fill="#d24a32"/>
      <text x="30" y="56" class="hand" font-size="38" fill="#d24a32" style="fill:#d24a32">A</text>
      <text id="title" x="68" y="46" class="hand" font-size="24">no tape</text>
      <text id="band" x="368" y="166" text-anchor="end" font-family="Share Tech Mono" font-size="14" fill="#fff3e6" letter-spacing="2">-- / --</text>
      <text x="32" y="166" font-family="Archivo Narrow" font-weight="700" font-size="11" fill="#fff3e6" letter-spacing="3" id="plName">MY MIX</text>
      <rect x="86" y="62" width="228" height="86" rx="43" fill="#262a2f"/>
      <g clip-path="url(#win)">
        <rect x="96" y="70" width="208" height="70" fill="#0e1012"/>
        <path id="strandL" stroke="#24160c" stroke-width="2.2" fill="none"/><path id="strandR" stroke="#24160c" stroke-width="2.2" fill="none"/>
        <path id="strandL2" stroke="#8a6444" stroke-width=".5" fill="none" opacity=".7"/><path id="strandR2" stroke="#8a6444" stroke-width=".5" fill="none" opacity=".7"/>
        <circle id="packL" class="pk" cx="146" cy="105" r="44" fill="url(#ringsL)"/><circle id="packR" class="pk" cx="254" cy="105" r="16" fill="url(#ringsR)"/>
        <circle id="fL" class="pk" cx="146" cy="105" r="44" fill="url(#fineL)"/><circle id="fR" class="pk" cx="254" cy="105" r="16" fill="url(#fineR)"/>
        <path id="sheenL" fill="#000" opacity=".16"/><path id="sheenR" fill="#000" opacity=".16"/>
        <circle id="gL" class="pk" cx="146" cy="105" r="44" fill="url(#gloss)"/><circle id="gR" class="pk" cx="254" cy="105" r="16" fill="url(#gloss)"/>
        <circle id="eL" class="pk" cx="146" cy="105" r="44" fill="none" stroke="#7a5536" stroke-width=".8" opacity=".8"/><circle id="eR" class="pk" cx="254" cy="105" r="16" fill="none" stroke="#7a5536" stroke-width=".8" opacity=".8"/>
      </g>
      <g id="hubL"></g><g id="hubR"></g>
      <rect x="96" y="70" width="208" height="70" rx="35" fill="url(#glass)" pointer-events="none"/>
      <path d="M74 252 L94 206 L306 206 L326 252 Z" fill="#2c3035"/>
      <line x1="104" y1="240" x2="296" y2="240" stroke="#24160c" stroke-width="3"/><line x1="104" y1="239" x2="296" y2="239" stroke="#8a6444" stroke-width=".6" opacity=".6"/>
      <rect x="126" y="226" width="14" height="14" rx="2" fill="#0e1012"/><rect x="260" y="226" width="14" height="14" rx="2" fill="#0e1012"/>
      <rect x="186" y="224" width="28" height="16" rx="2" fill="#0e1012"/>
      <g id="screws"></g>
      <circle class="hit" data-reel="L" cx="146" cy="105" r="52"/>
      <circle class="hit" data-reel="R" cx="254" cy="105" r="52"/>
      </g>
    </svg>
  </div>

  <div class="keys">
    <button class="key" id="kPrev" aria-label="previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg><small>back</small></button>
    <button class="key play" id="kPlay" aria-label="play"><svg viewBox="0 0 24 24" fill="currentColor"><path id="playIcon" d="M7 4v16l13-8z"/></svg><small>play</small></button>
    <button class="key" id="kNext" aria-label="next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg><small>next</small></button>
    <button class="key" id="kList" aria-label="track list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><small>list</small></button>
    <button class="key" id="kEject" aria-label="load songs"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l8 10H4zM4 17h16v3H4z"/></svg><small>load</small></button>
  </div>
  <div class="hint" id="hint">tap a reel to play · spin it to wind</div>
</div>

<div class="toast" id="toast"></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="track list">
  <header><label class="pl"><span class="stamp2">playlist name · tap to rename</span>
    <input id="plInput" maxlength="28" placeholder="name this tape" autocomplete="off" spellcheck="false"></label><button class="close" id="closeSheet" aria-label="close">&times;</button></header>
  <div class="tabs"><button class="tab on" id="tabSongs">songs</button><button class="tab" id="tabTapes">tapes</button><span class="sp"></span><button class="tab edit" id="editBtn">edit</button></div>
  <ul class="list" id="list"></ul>
  <p class="note" id="note" hidden></p>
  <footer><button class="btn fill" id="addBtn">add songs</button><button class="btn warn" id="wipeBtn">wipe tape</button></footer>
</div>
<input type="file" id="file" accept="audio/*" multiple hidden>

<script>
const $=s=>document.querySelector(s);
const NS='http://www.w3.org/2000/svg';
const audio=new Audio();audio.preload='auto';
let tracks=[],idx=0,url=null,db=null,storageOK=true;

/* ---------- build hubs and screws ---------- */
function mk(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e}
function buildHub(g,cx,cy){
  mk('circle',{cx,cy,r:15,fill:'#ece8df',stroke:'#b9b3a6','stroke-width':1},g);
  mk('circle',{cx,cy,r:9,fill:'#0e1012'},g);
  for(let i=0;i<6;i++){const a=i*60*Math.PI/180;
    mk('rect',{x:cx-1.6,y:cy-9.5,width:3.2,height:4.5,fill:'#ece8df',transform:`rotate(${i*60} ${cx} ${cy})`},g)}
  for(let i=0;i<3;i++)mk('circle',{cx:cx+11.5*Math.cos(i*2.094),cy:cy+11.5*Math.sin(i*2.094),r:1.4,fill:'#b9b3a6'},g);
}
buildHub($('#hubL'),146,105);buildHub($('#hubR'),254,105);
[[14,14],[386,14],[14,242],[386,242],[200,196]].forEach(([x,y])=>{const g=$('#screws');
  mk('circle',{cx:x,cy:y,r:5.5,fill:'#7a8087',stroke:'#2a2d31'},g);
  mk('path',{d:`M${x-3} ${y}H${x+3}M${x} ${y-3}V${y+3}`,stroke:'#2a2d31','stroke-width':1.4},g)});

/* ---------- storage ---------- */
function openDB(){return new Promise((res,rej)=>{try{const r=indexedDB.open('tapedeck',2);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('tracks'))d.createObjectStore('tracks',{keyPath:'id'});
    if(!d.objectStoreNames.contains('tapes'))d.createObjectStore('tapes',{keyPath:'id'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const store=(m,n='tracks')=>db.transaction(n,m).objectStore(n);
async function dbAll(n='tracks'){return db?req(store('readonly',n).getAll()):[]}
async function dbPut(t,n='tracks'){if(db)try{await req(store('readwrite',n).put(t))}catch(e){storageOK=false}}
async function dbDel(id,n='tracks'){if(db)try{await req(store('readwrite',n).delete(id))}catch(e){}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- tapes ---------- */
const COLORS=['#d24a32','#2f5d8a','#3d7a52','#c8901e','#6b4a8c','#2c2c2c'];
let tapes=[],allTracks=[],curTape=null;
const tapeOf=id=>tapes.find(t=>t.id===id);
function tapeTracks(id){return allTracks.filter(t=>t.tapeId===id).sort((a,b)=>a.order-b.order)}
function paintTape(){const t=tapeOf(curTape);if(!t)return;
  document.querySelectorAll('.bandc').forEach(r=>r.setAttribute('fill',t.color));plName=t.name;drawName()}
async function insertTape(id,animate=true){
  const t=tapeOf(id);if(!t)return;pause();
  const tp=$('#tape');if(animate){clunk(true);tp.classList.add('out');await new Promise(r=>setTimeout(r,300))}
  curTape=id;try{localStorage.setItem('tapeCur',id)}catch(e){}
  tracks=tapeTracks(id);idx=0;
  if(url)URL.revokeObjectURL(url);url=null;audio.removeAttribute('src');
  paintTape();if(tracks.length)loadTrack(0,false);else{setLabel();setPlayUI();renderList()}
  if(animate){tp.classList.remove('out');tp.classList.add('pop');setTimeout(()=>tp.classList.remove('pop'),260)}
}
async function newTape(){const t={id:uid(),name:'tape '+(tapes.length+1),color:COLORS[tapes.length%COLORS.length],created:Date.now()};
  tapes.push(t);await dbPut(t,'tapes');return t}
async function deleteTape(id){
  for(const tr of allTracks.filter(x=>x.tapeId===id))await dbDel(tr.id);
  allTracks=allTracks.filter(x=>x.tapeId!==id);tapes=tapes.filter(t=>t.id!==id);await dbDel(id,'tapes');
  if(!tapes.length)await newTape();
  if(id===curTape)await insertTape(tapes[0].id,false);
}

/* ---------- sounds ---------- */
let actx,windGain,windFilter,noiseBuf;
function ensureAudio(){
  if(actx){if(actx.state==='suspended')actx.resume();return}
  try{actx=new (window.AudioContext||window.webkitAudioContext)();
    noiseBuf=actx.createBuffer(1,actx.sampleRate*2,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const src=actx.createBufferSource();src.buffer=noiseBuf;src.loop=true;
    windFilter=actx.createBiquadFilter();windFilter.type='bandpass';windFilter.Q.value=1.4;windFilter.frequency.value=600;
    windGain=actx.createGain();windGain.gain.value=0;
    src.connect(windFilter).connect(windGain).connect(actx.destination);src.start();
  }catch(e){actx=null}
}
function clunk(heavy){
  ensureAudio();try{navigator.vibrate&&navigator.vibrate(heavy?22:12)}catch(e){}
  if(!actx)return;const t=actx.currentTime;
  const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';
  o.frequency.setValueAtTime(heavy?120:190,t);o.frequency.exponentialRampToValueAtTime(45,t+.07);
  g.gain.setValueAtTime(heavy?.35:.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.1);
  const n=actx.createBufferSource(),f=actx.createBiquadFilter(),ng=actx.createGain();n.buffer=noiseBuf;f.type='highpass';f.frequency.value=2500;
  ng.gain.setValueAtTime(.12,t);ng.gain.exponentialRampToValueAtTime(.001,t+.035);n.connect(f).connect(ng).connect(actx.destination);n.start(t,Math.random());n.stop(t+.05);
}

/* ---------- ui helpers ---------- */
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1800)}
function clean(n){return n.replace(/\.[^.]+$/,'').replace(/[_]+/g,' ').replace(/\s+/g,' ').trim()||'untitled'}
function fitTitle(s){const el=$('#title');el.textContent=s;let fs=24;el.setAttribute('font-size',fs);
  try{while(el.getComputedTextLength()>292&&fs>15){fs--;el.setAttribute('font-size',fs)}
    if(el.getComputedTextLength()>292){let t=s;while(t.length>1&&el.getComputedTextLength()>292){t=t.slice(0,-1);el.textContent=t.trim()+'…'}}}catch(e){}}
const pad=n=>String(n).padStart(2,'0');
function setLabel(){
  $('#kEject').classList.toggle('nudge',!tracks.length);
  if(!tracks.length){fitTitle('blank tape — press load');$('#band').textContent='-- / --';$('#status').textContent='no tape';return}
  fitTitle(tracks[idx].name);$('#band').textContent=pad(idx+1)+' / '+pad(tracks.length);
}
function setPlayUI(){const p=!audio.paused||(windMode!=='idle'&&wasPlaying);
  $('#kPlay').classList.toggle('down',p);$('#kPlay').setAttribute('aria-label',p?'pause':'play');
  $('#kPlay small').textContent=p?'pause':'play';
  $('#playIcon').setAttribute('d',p?'M6 4h4v16H6zM14 4h4v16h-4z':'M7 4v16l13-8z');
  if(tracks.length)$('#status').textContent=windMode!=='idle'?'winding':(p?'playing':'stopped');
  try{navigator.mediaSession&&(navigator.mediaSession.playbackState=audio.paused?'paused':'playing')}catch(e){}
}

/* ---------- player ---------- */
let artURL='';
(function(){try{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
  x.fillStyle='#2b2926';x.fillRect(0,0,256,256);x.fillStyle='#4b5158';x.fillRect(16,56,224,144);x.fillStyle='#efe3c2';x.fillRect(28,66,200,90);
  x.fillStyle='#d24a32';x.fillRect(28,140,200,16);x.fillStyle='#0e1012';x.beginPath();x.roundRect?x.roundRect(70,90,116,40,20):x.rect(70,90,116,40);x.fill();
  x.fillStyle='#ece8df';[100,156].forEach(cx=>{x.beginPath();x.arc(cx,110,11,0,7);x.fill()});artURL=c.toDataURL()}catch(e){}})();

let coverURL=null;
function setMeta(){if(!('mediaSession' in navigator)||!tracks.length)return;const t=tracks[idx];
  if(coverURL){URL.revokeObjectURL(coverURL);coverURL=null}
  let art=artURL?[{src:artURL,sizes:'256x256',type:'image/png'}]:[];
  if(t.art){try{coverURL=URL.createObjectURL(t.art);art=[{src:coverURL,sizes:'512x512',type:t.art.type||'image/jpeg'}]}catch(e){}}
  try{navigator.mediaSession.metadata=new MediaMetadata({title:t.name,artist:t.artist||plName,album:plName,artwork:art})}catch(e){}}
function loadTrack(i,autoplay){
  if(!tracks.length)return;idx=(i+tracks.length)%tracks.length;
  if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(tracks[idx].blob);audio.src=url;
  setLabel();setMeta();renderList();if(autoplay)play();else setPlayUI();
}
function play(){if(!tracks.length){openPicker();return}ensureAudio();audio.play().catch(()=>toast('tap play again'))}
function pause(){audio.pause()}
function toggle(){audio.paused?play():pause()}
function prev(){if(!tracks.length)return;if(audio.currentTime>3){audio.currentTime=0;return}loadTrack(idx-1,!audio.paused)}
function next(auto){if(!tracks.length)return;if(auto&&idx===tracks.length-1){loadTrack(0,false);toast('end of tape');return}loadTrack(idx+1,auto||!audio.paused)}
audio.addEventListener('play',setPlayUI);audio.addEventListener('pause',setPlayUI);
audio.addEventListener('ended',()=>next(true));
audio.addEventListener('error',()=>{if(tracks.length&&audio.src)toast("can't play that one — skipping")});

try{const ms=navigator.mediaSession;if(ms){ms.setActionHandler('play',play);ms.setActionHandler('pause',pause);
  ms.setActionHandler('previoustrack',prev);ms.setActionHandler('nexttrack',()=>next(false));
  try{ms.setActionHandler('seekto',d=>{audio.currentTime=d.seekTime})}catch(e){}}}catch(e){}

/* ---------- loading songs ---------- */
function openPicker(){$('#file').value='';$('#file').click()}
$('#file').addEventListener('change',async e=>{
  const files=[...e.target.files].filter(f=>f.type.startsWith('audio')||/\.(mp3|m4a|aac|wav|ogg|opus|flac)$/i.test(f.name));
  if(!files.length)return;files.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  const wasEmpty=!tracks.length;const base=Date.now();
  for(let i=0;i<files.length;i++){const f=files[i];
    const t={id:base+'-'+i+'-'+Math.random().toString(36).slice(2,7),tapeId:curTape,name:clean(f.name),blob:f,order:base+i};
    await readTags(t);tracks.push(t);allTracks.push(t);await dbPut(t)}
  const tp=$('#tape');tp.classList.add('pop');setTimeout(()=>tp.classList.remove('pop'),260);clunk(true);
  toast(files.length+(files.length>1?' songs':' song')+' on '+plName);
  if(wasEmpty)loadTrack(0,false);else{setLabel();renderList()}
  showNote();
});

/* ---------- song info from the files ---------- */
let tagLib=null;
function loadTagLib(){if(tagLib)return tagLib;tagLib=new Promise(res=>{const sc=document.createElement('script');
  sc.src='https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js';sc.onload=()=>res(window.jsmediatags||null);sc.onerror=()=>{tagLib=null;res(null)};document.head.appendChild(sc)});return tagLib}
async function readTags(t){const lib=await loadTagLib();if(!lib)return false;
  return new Promise(res=>{try{lib.read(t.blob,{onSuccess:({tags})=>{
      if(tags.title&&tags.title.trim())t.name=tags.title.trim();
      if(tags.artist&&tags.artist.trim())t.artist=tags.artist.trim();
      if(tags.picture&&tags.picture.data&&tags.picture.data.length)t.art=new Blob([new Uint8Array(tags.picture.data)],{type:tags.picture.format||'image/jpeg'});
      t.tagged=true;res(true)},onError:()=>{t.tagged=true;res(true)}})}catch(e){res(false)}})}
async function tagOld(){for(const t of allTracks.filter(x=>!x.tagged)){if(!(await readTags(t)))return;await dbPut(t);
  if(tracks[idx]===t){setLabel();setMeta()}}renderList()}

function armBtn(btn,label,fn){btn.onclick=ev=>{ev.stopPropagation();
  if(btn.classList.contains('armed')){fn();return}btn.classList.add('armed');btn.dataset.o=btn.textContent;btn.textContent=label;
  setTimeout(()=>{btn.classList.remove('armed');btn.textContent=btn.dataset.o},3000)}}

  $('#tabSongs').classList.toggle('on',view==='songs');$('#tabTapes').classList.toggle('on',view==='tapes');

  $('.sheet footer').hidden=view!=='songs';

    tapes.forEach(t=>{const n=allTracks.filter(x=>x.tapeId===t.id).length;

      e.onclick=async()=>{if(editing)return;if(t.id!==curTape){closeSheet();await insertTape(t.id)}else{view='songs';renderList()}};
      ul.appendChild(e)});
    const add=li('<span class="n">+</span><span class="t">new tape</span>');add.className='add';
    add.onclick=async()=>{const t=await newTape();closeSheet();await insertTape(t.id);toast('blank tape in — press load')};ul.appendChild(add);return}
  if(!tracks.length){ul.innerHTML='<li class="empty"><span class="t">blank tape</span></li><li class="add"><span class="n">+</span><span class="t">add songs</span></li>';
    ul.querySelector('.add').onclick=()=>{clunk();openPicker()};return}

    if(editing){const tl=document.createElement('span');tl.className='tools';
      tl.innerHTML='<button aria-label="move up">▲</button><button aria-label="move down">▼</button><button class="rm" aria-label="remove">✕</button>';
      const[u,d,r]=tl.querySelectorAll('button');
      u.onclick=ev=>{ev.stopPropagation();move(i,-1)};d.onclick=ev=>{ev.stopPropagation();move(i,1)};
      armBtn(r,'remove',()=>removeTrack(i));e.appendChild(tl)}
    e.onclick=()=>{if(editing)return;clunk();loadTrack(i,true);closeSheet()};ul.appendChild(e)})}
async function move(i,dir){const j=i+dir;if(j<0||j>=tracks.length)return;
  const a=tracks[i],b=tracks[j];[a.order,b.order]=[b.order,a.order];[tracks[i],tracks[j]]=[b,a];
  if(idx===i)idx=j;else if(idx===j)idx=i;
  await dbPut(a);await dbPut(b);setLabel();renderList()}
async function removeTrack(i){const t=tracks[i],wasCur=i===idx,was=!audio.paused;
  tracks.splice(i,1);allTracks=allTracks.filter(x=>x!==t);await dbDel(t.id);
  if(!tracks.length){pause();audio.removeAttribute('src');if(url)URL.revokeObjectURL(url);url=null;idx=0;setLabel();setPlayUI()}
  else if(wasCur)loadTrack(Math.min(i,tracks.length-1),was);
  else{if(i<idx)idx--;setLabel()}
  renderList();toast('song removed')}
$('#tabSongs').onclick=()=>{view='songs';editing=false;renderList()};
$('#tabTapes').onclick=()=>{view='tapes';editing=false;renderList()};
$('#editBtn').onclick=()=>{editing=!editing;renderList()};

  const on=$('#list .on');on&&on.scrollIntoView({block:'center'})}

$('#closeSheet').onclick=closeSheet;$('#sheetBg').onclick=closeSheet;
$('#addBtn').onclick=()=>{clunk();openPicker()};
$('#wipeBtn').onclick=async()=>{const w=$('#wipeBtn');
  if(!w.classList.contains('armed')){w.classList.add('armed');w.textContent='tap again to wipe';setTimeout(disarm,3000);return}
  clunk(true);pause();audio.removeAttribute('src');if(url)URL.revokeObjectURL(url);url=null;
  for(const t of tracks)await dbDel(t.id);allTracks=allTracks.filter(x=>x.tapeId!==curTape);tracks=[];idx=0;
  setLabel();renderList();setPlayUI();disarm();toast('tape wiped')};

/* ---------- reels ---------- */
const RMIN=16,RMAX=44,TAPE_SPEED=30;
const C={L:[146,105],R:[254,105]};
let aL=0,aR=0,rL=RMAX,rR=RMIN;
let windMode='idle',wasPlaying=false,vel=0,drag=null,windReel='L';
const secPerRad=()=>Math.max(1.3,(audio.duration||180)/(2*Math.PI*14));

function wind(dAng,reel){ // dAng in radians, clockwise = forward
  const rT=reel==='L'?rL:rR,rO=reel==='L'?rR:rL,dO=dAng*rT/rO;
  if(reel==='L'){aL+=dAng;aR+=dO}else{aR+=dAng;aL+=dO}
  tapeRun+=dAng*rT;
  if(tracks.length&&isFinite(audio.duration)){
    let t=audio.currentTime+dAng*secPerRad();
    if(t<=0){t=0;if(windMode==='coast')vel=0}
    if(t>=audio.duration-.15){t=audio.duration-.15;if(windMode==='coast')vel=0}
    audio.currentTime=t}
}
function startWind(){if(windMode!=='idle')return;wasPlaying=!audio.paused;audio.pause();windMode='drag';setPlayUI();
  const h=$('#hint');if(!h.classList.contains('gone')){h.classList.add('gone');try{localStorage.setItem('tapeHint','1')}catch(e){}}}
function endWind(){windMode='idle';vel=0;drag=null;if(wasPlaying)play();wasPlaying=false;setPlayUI()}
try{if(localStorage.getItem('tapeHint'))$('#hint').classList.add('gone')}catch(e){}

function centerPx(reel){const svg=$('#tape'),pt=svg.createSVGPoint();pt.x=C[reel][0];pt.y=C[reel][1];
  const q=pt.matrixTransform($('#rot').getScreenCTM());return[q.x,q.y]}
function angOf(e,reel){const[cx,cy]=centerPx(reel);return{a:Math.atan2(e.clientY-cy,e.clientX-cx),d:Math.hypot(e.clientX-cx,e.clientY-cy)}}

document.querySelectorAll('.hit').forEach(h=>{
  h.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();h.setPointerCapture(e.pointerId);
    const reel=h.dataset.reel,p=angOf(e,reel);
    const stopped=windMode==='coast';if(stopped){windMode='drag';vel=0}
    drag={reel,last:p.a,moved:0,t:performance.now(),stopped,scrub:stopped};windReel=reel});
  h.addEventListener('pointermove',e=>{if(!drag)return;const p=angOf(e,drag.reel);
    let d=p.a-drag.last;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;drag.last=p.a;
    if(p.d<10)return;drag.moved+=Math.abs(d);
    if(!drag.scrub&&drag.moved>.3){drag.scrub=true;startWind()}
    if(drag.scrub){const now=performance.now(),dt=Math.max(.008,(now-drag.t)/1000);drag.t=now;
      vel=vel*.5+(d/dt)*.5;wind(d,drag.reel)}});
  const up=()=>{if(!drag)return;
    if(drag.scrub){if(Math.abs(vel)>6&&!drag.stopped){windMode='coast';drag=null}else endWind()}
    else{drag=null;clunk();toggle()}};
  h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
});

let tapeRun=0;
function strand(k,cx,r,gx,gy,side){const cy=105,dx=gx-cx,dy=gy-cy,d=Math.hypot(dx,dy),b=Math.atan2(dy,dx),o=Math.acos(Math.min(1,r/d))*side;
  const tx=cx+r*Math.cos(b+o),ty=cy+r*Math.sin(b+o),p=`M${gx} ${gy}L${tx.toFixed(1)} ${ty.toFixed(1)}`;
  $('#strand'+k).setAttribute('d',p);$('#strand'+k+'2').setAttribute('d',p)}
function sheen(k,cx,r,a){const cy=105,r0=15;let p='';
  for(const [off,w] of [[0,.08],[2.1,.04],[3.9,.12]]){const a1=a+off,a2=a1+w;
    p+=`M${cx+r0*Math.cos(a1)} ${cy+r0*Math.sin(a1)}L${cx+r*Math.cos(a1)} ${cy+r*Math.sin(a1)}A${r} ${r} 0 0 1 ${cx+r*Math.cos(a2)} ${cy+r*Math.sin(a2)}L${cx+r0*Math.cos(a2)} ${cy+r0*Math.sin(a2)}Z`}
  $('#sheen'+k).setAttribute('d',p)}
let last=performance.now();
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;
  const p=(tracks.length&&audio.duration)?Math.min(1,audio.currentTime/audio.duration):0;
  rL=RMIN+(RMAX-RMIN)*(1-p);rR=RMIN+(RMAX-RMIN)*p;
  if(windMode==='coast'){wind(vel*dt,windReel);vel*=Math.pow(.2,dt);if(Math.abs(vel)<.8)endWind()}
  else if(windMode==='drag'){vel*=Math.pow(.002,dt)}
  else if(!audio.paused){aL+=TAPE_SPEED/rL*dt;aR+=TAPE_SPEED/rR*dt}
  if(windGain){const s=windMode==='idle'?0:Math.min(Math.abs(vel)/22,1);
    windGain.gain.setTargetAtTime(s*.16,actx.currentTime,.03);windFilter.frequency.setTargetAtTime(350+s*2600,actx.currentTime,.05)}
  tapeRun+=(windMode==='idle'?(audio.paused?0:TAPE_SPEED*dt):0);
  document.querySelectorAll('.run').forEach(e=>e.setAttribute('stroke-dashoffset',(-tapeRun).toFixed(1)));
  strand('L',146,rL,104,182,-1);strand('R',254,rR,296,182,1);
  sheen('L',146,rL,aL);sheen('R',254,rR,aR);
  ['packL','fL','gL','eL'].forEach(i=>$('#'+i).setAttribute('r',rL.toFixed(2)));['packR','fR','gR','eR'].forEach(i=>$('#'+i).setAttribute('r',rR.toFixed(2)));
  $('#hubL').setAttribute('transform',`rotate(${(aL*57.2958)%360} 146 105)`);
  $('#hubR').setAttribute('transform',`rotate(${(aR*57.2958)%360} 254 105)`);
  const s=Math.floor(audio.currentTime||0),m=Math.min(9,Math.floor(s/60)),ss=pad(s%60);
  $('#c0').textContent=m;$('#c1').textContent=ss[0];$('#c2').textContent=ss[1];
  drawTrack();requestAnimationFrame(frame)}
requestAnimationFrame(frame);


/* ---------- orientation: stand the tape up when the space is tall ---------- */
function orient(){const w=$('.well'),r=w.getBoundingClientRect(),tall=r.height>r.width*1.05;
  $('#tape').setAttribute('viewBox',tall?'0 0 256 400':'0 0 400 256');
  if(tall)$('#rot').setAttribute('transform','translate(256 0) rotate(90)');else $('#rot').removeAttribute('transform');
  const k=$('.keys');
  if(tall){if(k.parentNode!==$('.app'))$('.app').insertBefore(k,$('.hint'));k.classList.remove('onTape');k.removeAttribute('style');return}
  if(k.parentNode!==w)w.appendChild(k);k.classList.add('onTape');
  requestAnimationFrame(()=>{const m=$('#rot').getScreenCTM(),wr=w.getBoundingClientRect();if(!m)return;
    const p=(x,y)=>{const q=$('#tape').createSVGPoint();q.x=x;q.y=y;return q.matrixTransform(m)};
    const a=p(30,180),b=p(370,250);
    Object.assign(k.style,{left:(a.x-wr.left)+'px',top:(a.y-wr.top)+'px',width:(b.x-a.x)+'px',height:(b.y-a.y)+'px'})})}
try{new ResizeObserver(orient).observe($('.well'))}catch(e){addEventListener('resize',orient)}
orient();
/* ---------- playlist name ---------- */
let plName='my mix';try{plName=localStorage.getItem('tapeName')||plName}catch(e){}
function drawName(){const el=$('#plName');el.textContent=plName.toUpperCase();let ls=3;el.setAttribute('letter-spacing',ls);
  try{while(el.getComputedTextLength()>250&&ls>0){ls-=.5;el.setAttribute('letter-spacing',ls)}
    let t=plName.toUpperCase();while(el.getComputedTextLength()>250&&t.length>1){t=t.slice(0,-1);el.textContent=t.trim()+'…'}}catch(e){}
  $('#plInput').value=plName;try{navigator.mediaSession&&tracks.length&&setMeta()}catch(e){}}
$('#plInput').addEventListener('input',e=>{plName=e.target.value.trim()||'my mix';const t=tapeOf(curTape);if(t){t.name=plName;dbPut(t,'tapes')}drawName();$('#plInput').value=e.target.value});
$('#plInput').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur()});
drawName();if(document.fonts)document.fonts.ready.then(drawName);
/* ---------- position tracker ---------- */
const fmt=t=>{t=Math.max(0,Math.floor(t||0));return Math.floor(t/60)+':'+pad(t%60)};
function drawTrack(){const d=audio.duration,ok=tracks.length&&isFinite(d)&&d>0,p=ok?audio.currentTime/d:0;
  $('#tFill').style.width=(p*100)+'%';$('#tNeedle').style.left=(p*100)+'%';
  $('#tNow').textContent=fmt(ok?audio.currentTime:0);$('#tLen').textContent=ok?fmt(d):'0:00'}
(function(){const r=$('#ruler');let on=false,was=false;
  const seek=e=>{const b=r.getBoundingClientRect(),p=Math.min(1,Math.max(0,(e.clientX-b.left)/b.width));
    if(tracks.length&&isFinite(audio.duration))audio.currentTime=Math.min(p*audio.duration,audio.duration-.15)};
  r.addEventListener('pointerdown',e=>{if(!tracks.length)return;on=true;was=!audio.paused;audio.pause();r.setPointerCapture(e.pointerId);seek(e)});
  r.addEventListener('pointermove',e=>{if(on)seek(e)});
  const up=()=>{if(!on)return;on=false;clunk();if(was)play()};r.addEventListener('pointerup',up);r.addEventListener('pointercancel',up)})();
/* ---------- install as an app ---------- */
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
  let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloaded&&audio.paused){reloaded=true;location.reload()}});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
/* ---------- boot ---------- */
(async()=>{setLabel();
  try{db=await openDB();allTracks=await dbAll();tapes=await dbAll('tapes')}catch(e){storageOK=false;db=null}
  tapes.sort((a,b)=>a.created-b.created);
  if(!tapes.length){let nm='my mix';try{nm=localStorage.getItem('tapeName')||nm}catch(e){}
    tapes.push({id:uid(),name:nm,color:COLORS[0],created:Date.now()});await dbPut(tapes[0],'tapes')}
  for(const t of allTracks)if(!t.tapeId||!tapeOf(t.tapeId)){t.tapeId=tapes[0].id;await dbPut(t)}
  let cur=null;try{cur=localStorage.getItem('tapeCur')}catch(e){}
  await insertTape(tapeOf(cur)?cur:tapes[0].id,false);
  if(document.fonts)document.fonts.ready.then(()=>{setLabel();drawName()});
  setTimeout(tagOld,1500);
})();
</script>
</body>
